services:
  app:
    image: ${APP_IMAGE:-elhalawany-devops-app:latest}
    container_name: elhalawany-uat-app
    restart: unless-stopped
    env_file:
      - .env.uat
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
    networks:
      - devops-network

  nginx:
    image: nginx:alpine
    container_name: elhalawany-uat-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - devops-network

  postgres:
    image: postgres:16-alpine
    container_name: elhalawany-uat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devopsuser
      POSTGRES_PASSWORD: devopspassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-network

  redis:
    image: redis:7-alpine
    container_name: elhalawany-uat-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - devops-network

volumes:
  postgres-data:
  redis-data:

networks:
  devops-network:
    driver: bridge
