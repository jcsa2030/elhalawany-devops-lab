services:
  app:
    image: ${APP_IMAGE:-elhalawany-devops-app:latest}
    restart: unless-stopped
    env_file:
      - .env.dev
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
    networks:
      - devops-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - devops-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devsecopsdb
      POSTGRES_USER: devsecops
      POSTGRES_PASSWORD: devsecops_password_change_me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - devops-network

volumes:
  postgres-data:
  redis-data:

networks:
  devops-network:
    driver: bridge
